services:
  - type: web
    name: landslide-early-warning
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && (pip install -r requirements.txt || pip3 install -r requirements.txt || true)
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MONGODB_URI
        sync: false
